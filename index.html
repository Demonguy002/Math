<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOTQUEST AI — Mathematical Root Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="math-field"></div>
<div class="particles"></div>
<div class="scanlines"></div>

<header class="topbar">
  <div class="brand">⚡ ROOTQUEST <span>AI</span></div>
  <div class="top-actions">
    <span id="userBadge">GUEST</span>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Switch theme">☀️</button>
    <button class="ghost" onclick="showDashboard()">Dashboard</button>
    <button class="ghost" onclick="logout()">Logout</button>
  </div>
</header>

<main class="container">
  <section id="login" class="screen"></section>
  <section id="dashboard" class="screen"></section>
  <section id="app" class="screen"></section>
  <canvas id="graph" width="1000" height="480"></canvas>
</main>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
